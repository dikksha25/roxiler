name: Store Rate CI / Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Backend Tests & Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci
          cd backend && npm ci && cd ..
          cd frontend && npm ci && cd ..

      - name: Run Backend Automated Test Suites (8 Suites / 86+ Assertions)
        env:
          NODE_ENV: test
          JWT_SECRET: test_ci_super_secure_jwt_secret_key_store_rating_2026
        run: npm test

      - name: Build Frontend Production Bundle (Vite)
        run: npm run build:frontend

      - name: Verify Clean Build Artifacts
        run: |
          test -f frontend/dist/index.html
          echo "✅ Production bundle successfully generated."
